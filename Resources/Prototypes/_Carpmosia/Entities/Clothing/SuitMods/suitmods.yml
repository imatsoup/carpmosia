- type: entity
  id: BaseSuitMod
  parent: BaseItem
  name: suit modkit
  description: A modkit for a standard hardsuit.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Tools/upgrade.rsi
  - type: Item
    size: Small
  - type: SuitMod
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - SuitMod

- type: entity
  id: SuitModInvis
  parent: BaseSuitMod
  name: Hardsuit modkit (invis)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ SuitModInvis ]
    examineText: gun-upgrade-examine-text-damage
  - type: SuitModBody
    componentsToAdd:
    - type: Stealth
      minVisibility: 0.1
      lastVisibility: 0.1

- type: entity
  id: SuitModHelmet
  parent: BaseSuitMod
  name: Hardsuit modkit (visor)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ SuitModHelmet ]
    examineText: gun-upgrade-examine-text-damage
  - type: SuitModHelmet
    componentsToAdd:
    - type: ShowHealthBars
    - type: ShowHealthIcons

- type: entity
  id: SuitModAxeslot
  parent: BaseSuitMod
  name: Hardsuit modkit (axeslot)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ SuitModAxe, SlotMod ]
    examineText: gun-upgrade-examine-text-damage
  - type: SuitModBody
    componentsToAdd:
    - type: ItemSlots
      slots:
        axe_slot:
          name: "axe"
          insertSound: /Audio/Effects/packetrip.ogg
          ejectSound: /Audio/Effects/packetrip.ogg
          whitelist:
            tags:
              - FireAxe
