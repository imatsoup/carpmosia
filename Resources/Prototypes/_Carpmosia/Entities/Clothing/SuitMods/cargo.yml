
## Abilities
- type: entity
  id: SuitModGrappleHook
  parent: BaseSuitMod
  name: Hardsuit modkit (EJP)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ GrappleHookMod ]
    examineText: suit-mod-jetpack
  - type: SuitModBody
    componentsToAdd:
    - type: ActionGrant
      actions:
      - ActionDeployEquipment
    - type: ItemActionGrant
      actions:
      - ActionDeployEquipment
      activeIfWorn: true
    - type: SuitModEquipmentToggle
      action: ActionDeployEquipment
      spawnedPrototype: ModMiningDrill
  - type: Tag
    tags:
    - CargoMod

## Item storage slots
- type: entity
  id: SuitModCrusherSlot
  parent: BaseSuitMod
  name: Hardsuit modkit (crusher-slot)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ CrusherSlotMod ]
    examineText: suit-mod-crusher-slot
  - type: SuitModSlot
    keys: [ crusher-slot ]
    whitelists:
      - tags:
        - Pickaxe
  - type: Tag
    tags:
    - CargoMod
