# Base Mod (for contraband)
- type: entity
  id: BaseMedSuitMod
  parent: [ BaseSuitMod, BaseSecurityContraband ]
  name: suit modkit
  description: A modkit for a standard security hardsuit.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: Tag
    tags:
    - MedicalMod

## Visor mods
- type: entity
  id: SuitModMedVisor
  parent: BaseMedSuitMod
  name: Hardsuit modkit (medical visor)
  components:
  - type: SuitMod
    tags: [ MedicalVisorMod ]
    examineText: suit-mod-medhud
  - type: SuitModHelmet
    componentsToAdd:
    - type: ShowHealthBars
    - type: ShowHealthIcons

- type: entity
  id: SuitModChemVisor
  parent: BaseMedSuitMod
  name: Hardsuit modkit (chem visor)
  components:
  - type: SuitMod
    tags: [ ChemVisorMod ]
    examineText: suit-mod-medhud
  - type: SuitModHelmet
    componentsToAdd:
    - type: SolutionScanner
