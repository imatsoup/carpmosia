## Visor mods
- type: entity
  id: SuitModMedVisor
  parent: BaseSuitMod
  name: Hardsuit modkit (medical visor)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ MedicalVisorMod ]
    examineText: suit-mod-medhud
  - type: SuitModHelmet
    componentsToAdd:
    - type: ShowHealthBars
    - type: ShowHealthIcons
  - type: Tag
    tags:
    - MedicalMod

- type: entity
  id: SuitModChemVisor
  parent: BaseSuitMod
  name: Hardsuit modkit (chem visor)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ ChemVisorMod ]
    examineText: suit-mod-medhud
  - type: SuitModHelmet
    componentsToAdd:
    - type: SolutionScanner
  - type: Tag
    tags:
    - MedicalMod
