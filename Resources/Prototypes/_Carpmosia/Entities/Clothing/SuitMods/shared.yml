## Abilities
- type: entity
  id: SuitModJetpack
  parent: BaseSuitMod
  name: Hardsuit modkit (EJP)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ JetpackMod ]
    examineText: suit-mod-jetpack
  - type: SuitModBody
    componentsToAdd:
    - type: GasTank
      releasePressure: 21.3
      air:
        volume: 0.2
        temperature: 293.15
    - type: Jetpack
      moleUsage: 0.00085
  - type: Tag
    tags:
    - CargoMod
    - EngineeringMod
    - SecurityMod

## Visor mods
- type: entity
  id: SuitModDiagnosticVisor
  parent: BaseSuitMod
  name: Hardsuit modkit (diagnostic hud)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ DiagnosticVisorMod ]
    examineText: suit-mod-diagnostic-visor
  - type: SuitModHelmet
    componentsToAdd:
    - type: ShowHealthIcons
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
  - type: Tag
    tags:
    - HudDiagnostic
    - CargoMod
    - EngineeringMod
    - ScienceMod
