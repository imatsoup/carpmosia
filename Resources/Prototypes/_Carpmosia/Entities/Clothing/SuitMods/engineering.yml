# Base Mod (for contraband)
- type: entity
  id: BaseEngiSuitMod
  parent: [ BaseSuitMod, BaseSecurityContraband ]
  name: suit modkit
  description: A modkit for a standard security hardsuit.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: Tag
    tags:
    - EngineeringMod

## Item storage slots
- type: entity
  id: SuitModAxeSlot
  parent: BaseEngiSuitMod
  name: Hardsuit modkit (axe-slot)
  components:
  - type: SuitMod
    tags: [ AxeSlotMod ]
    examineText: suit-mod-axe-slot
  - type: SuitModSlot
    keys: [ AxeSlot ]
    whitelists:
      - tags:
        - FireAxe

## Visor mods
- type: entity
  id: SuitModWeldingVisor
  parent: BaseEngiSuitMod
  name: Hardsuit modkit (welding visor)
  components:
  - type: SuitMod
    tags: [ WeldingVisorMod ]
    examineText: suit-mod-welding-visor
  - type: SuitModHelmet
    componentsToAdd:
    - type: EyeProtection
    - type: FlashImmunity

- type: entity
  id: SuitModThermalVisor # Maybe someone will actually fucking bother with it
  parent: BaseEngiSuitMod
  name: Hardsuit modkit (thermal hud)
  components:
  - type: SuitMod
    tags: [ ThermalVisorMod ]
    examineText: suit-mod-thermal-visor
  - type: SuitModHelmet
    componentsToAdd:
    - type: ThermalSight
  - type: Tag
    tags:
    - EngineeringMod
