## Item storage slots
- type: entity
  id: SuitModAxeSlot
  parent: BaseSuitMod
  name: Hardsuit modkit (axe-slot)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ AxeSlotMod ]
    examineText: gun-upgrade-examine-text-damage
  - type: SuitModSlot
    keys: [ AxeSlot ]
    whitelists:
      - tags:
        - FireAxe
  - type: Tag
    tags:
    - EngineeringMod

## Visor mods
- type: entity
  id: SuitModWeldingVisor
  parent: BaseSuitMod
  name: Hardsuit modkit (welding visor)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec9b2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb4c13"
  - type: SuitMod
    tags: [ WeldingVisorMod ]
    examineText: gun-upgrade-examine-text-damage
  - type: SuitModHelmet
    componentsToAdd:
    - type: EyeProtection
    - type: FlashImmunity
  - type: Tag
    tags:
    - WeldingMask
    - EngineeringMod

