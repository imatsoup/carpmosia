- type: entity
  name: prophunter's toolbox
  parent: ToolboxSyndicate
  id: ToolboxProphunt
  description: A deadly toolbox for hunting mimics.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
  - type: MultiHandedItem
  - type: Unremoveable # Using something else in prophunt would be cheating
  - type: MeleeWeapon
    damage:
      types:
        Radiation: 20
  - type: PropHunter
    damage:
      types:
        Radiation: 2
    healing:
      types:
        Radiation: -10

- type: entity
  parent: ChameleonProjectorNoBattery
  id: ChameleonProjectorProphunt
  name: mimic device
  description: Advanced infiltrator device allowing perpetual disguise of inanimate objects.
  components:
  - type: MultiHandedItem
  - type: Unremoveable
